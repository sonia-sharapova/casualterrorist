<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casual Terrorist — Ryan Hildebrandt</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* ===== LANDING OVERRIDES ===== */
        .landing-body {
            overflow-x: hidden;
        }

        .landing {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            position: relative;
            z-index: 1;
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 40px;
        }

        /* ===== HERO: logo centered with breathing room ===== */
        .hero {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding: 60px 0 30px 0;
            z-index: 10;
        }

        .logo-cluster {
            display: flex;
            align-items: center;
            gap: 0;
            opacity: 0;
            transform: translateY(25px);
            animation: fadeUp 0.8s ease-out 0.2s forwards;
        }

        .logo-cluster img {
            height: 110px;
            display: block;
        }

        .logo-cluster img.logo-spin {
            margin: 0 -2px;
        }

        /* ===== NAVIGATION GRID ===== */
        .nav-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0;
            position: relative;
            z-index: 100;
            margin-top: 10%;
            border: 1px solid #222;
        }

        .nav-cell {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            border-right: 1px solid #222;
            cursor: pointer;
            text-decoration: none;
            overflow: hidden;
            transition: all 0.4s ease;
            opacity: 0;
            transform: translateY(30px);
        }

        .nav-cell:last-child {
            border-right: none;
        }

        /* Staggered entrance */
        .nav-cell:nth-child(1) { animation: fadeUp 0.6s ease-out 0.4s forwards; }
        .nav-cell:nth-child(2) { animation: fadeUp 0.6s ease-out 0.55s forwards; }
        .nav-cell:nth-child(3) { animation: fadeUp 0.6s ease-out 0.7s forwards; }
        .nav-cell:nth-child(4) { animation: fadeUp 0.6s ease-out 0.85s forwards; }

        .nav-cell img {
            height: 90px;
            object-fit: contain;
            transition: transform 0.4s ease, filter 0.4s ease;
            position: relative;
            z-index: 2;
        }

        .nav-cell .nav-label {
            font-family: "League Gothic", "Mozilla Text", sans-serif;
            font-size: 1.4rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #555;
            margin-top: 15px;
            transition: color 0.4s ease, letter-spacing 0.4s ease;
            position: relative;
            z-index: 2;
        }

        /* Hover: image lifts, label lights up, subtle bg glow */
        .nav-cell::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at center, rgba(92, 218, 57, 0.06) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.4s ease;
            z-index: 0;
        }

        .nav-cell:hover::before {
            opacity: 1;
        }

        .nav-cell:hover img {
            transform: translateY(-8px) scale(1.05);
        }

        .nav-cell:hover .nav-label {
            color: #fff;
            letter-spacing: 0.18em;
        }

        .nav-cell:active img {
            transform: translateY(-4px) scale(0.98);
        }

        /* ===== SPIDER WEB + SPIDER (atmospheric) ===== */
        .spider-web {
            position: absolute;
            top: -30%;
            right: -8%;
            width: 800px;
            height: 800px;
            opacity: 0.25;
            z-index: 0;
            pointer-events: none;
            animation: webFade 1.5s ease-out 0.1s forwards;
        }

        .spider-web img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .spider {
            position: absolute;
            top: -150px;
            right: -5%;
            width: 600px;
            z-index: 1;
            rotate: 13deg;
            pointer-events: none;
            opacity: 0;
            animation: spiderDrop 1.2s ease-out 1s forwards;
        }

        .spider img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        @keyframes spiderDrop {
            0% { opacity: 0; transform: translateY(-40px); }
            60% { opacity: 0.9; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes webFade {
            0% { opacity: 0; }
            100% { opacity: 0.25; }
        }

        /* ===== BOTTOM LINKS ROW ===== */
        .landing-links {
            display: flex;
            justify-content: flex-start;
            gap: 40px;
            padding: 30px 0;
            margin-top: 30px;
            border-top: 1px solid #1a1a1a;
            opacity: 0;
            animation: fadeUp 0.6s ease-out 1.1s forwards;
            transform: translateY(15px);
        }

        .landing-links a {
            color: #555;
            font-family: "Edu AU VIC WA NT Arrows", cursive;
            font-size: 1.1rem;
            letter-spacing: 0.12em;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: color 0.3s ease;
        }

        .landing-links a:hover {
            color: #5cda39;
        }

        .landing-links a img {
            width: 18px;
            height: 18px;
            filter: invert(0.4);
            transition: filter 0.3s ease;
        }

        .landing-links a:hover img {
            filter: invert(0.7) sepia(1) saturate(5) hue-rotate(80deg);
        }

        /* ===== TAGLINE ===== */
        .tagline {
            color: #333;
            font-family: "Inconsolata", monospace;
            font-size: 0.75rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            padding: 10px 0 40px 0;
            opacity: 0;
            animation: fadeUp 0.6s ease-out 1.3s forwards;
            transform: translateY(10px);
        }

        /* ===== SHARED KEYFRAMES ===== */
        @keyframes fadeUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== RESPONSIVE ===== */

        @media (max-width: 1400px) {
            .landing {
                padding: 0 20px;
            }

            .spider-web {
                width: 550px;
                height: 550px;
                top: -10%;
            }

            .spider {
                width: 400px;
                top: -80px;
            }

            .nav-cell img {
                height: 100px;
            }
        }

        @media (max-width: 900px) {
            .nav-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .nav-cell {
                border-bottom: 1px solid #222;
                padding: 30px 15px;
            }

            /* fix borders for 2-col */
            .nav-cell:nth-child(2) { border-right: none; }
            .nav-cell:nth-child(3) { border-right: 1px solid #222; }

            .spider-web {
                width: 400px;
                height: 400px;
                opacity: 0.15;
            }

            .spider {
                width: 250px;
                top: -40px;
                right: -5%;
            }
        }

        @media (max-width: 600px) {
            .hero {
                padding: 35px 0 15px 0;
                justify-content: center;
            }

            .logo-cluster img {
                height: 65px;
            }

            .nav-grid {
                grid-template-columns: 1fr 1fr;
                margin-top: 15px;
            }

            .nav-cell {
                padding: 25px 10px;
            }

            .nav-cell img {
                height: 70px;
            }

            .nav-cell .nav-label {
                font-size: 1rem;
                margin-top: 10px;
            }

            .spider-web {
                width: 280px;
                height: 280px;
            }

            .spider {
                width: 160px;
                top: -20px;
                right: 0;
            }

            .landing-links {
                flex-wrap: wrap;
                gap: 20px;
                justify-content: center;
            }

            .landing-links a {
                font-size: 0.9rem;
            }

            .tagline {
                text-align: center;
            }
        }
    </style>
</head>
