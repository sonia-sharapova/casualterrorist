<script>
  // Parse animations.md into structured row data
  function parseAnimationsMarkdown(md) {
    const rows = [];
    let currentRow = null;
    let currentItem = null;

    const lines = md.split('\n');

    for (const line of lines) {
      const trimmed = line.trim();

      // Row header (## Row 1, ## Row 2, etc.)
      if (trimmed.startsWith('## ') && !trimmed.startsWith('###')) {
        currentRow = { title: trimmed.replace('## ', ''), items: [] };
        rows.push(currentRow);
        currentItem = null;
      }
      // Item header (### Item Name)
      else if (trimmed.startsWith('### ')) {
        const name = trimmed.replace('### ', '');
        currentItem = { name: name, image: '', alt: '', clickable: true };
        if (currentRow) {
          currentRow.items.push(currentItem);
        }
      }
      // Item properties (- key: value)
      else if (trimmed.startsWith('- ') && currentItem) {
        const match = trimmed.match(/^- (\w+):\s*(.+)$/);
        if (match) {
          const key = match[1];
          const value = match[2];
          if (key === 'clickable') {
            currentItem.clickable = value.toLowerCase() !== 'false';
          } else {
            currentItem[key] = value;
          }
        }
      }
    }

    return rows;
  }

  // Render the gallery from parsed data
  function renderAnimations(rows) {
    const gallery = document.getElementById('artGallery');
    gallery.innerHTML = '';

    for (const row of rows) {
      const rowEl = document.createElement('div');
      rowEl.className = 'art-row';

      for (const item of row.items) {
        const itemEl = document.createElement('div');
        itemEl.className = 'art-item';

        if (item.clickable) {
          itemEl.onclick = () => openArtModal(item.image, item.name);
        }

        const img = document.createElement('img');
        img.src = item.image;
        img.alt = item.alt || item.name;

        itemEl.appendChild(img);
        rowEl.appendChild(itemEl);
      }

      gallery.appendChild(rowEl);
    }
  }

  // Fetch and parse animations.md on load
  async function loadAnimations() {
    try {
      const response = await fetch('../data/animations.md');
      if (!response.ok) throw new Error('Failed to load animations.md');
      const text = await response.text();
      const rows = parseAnimationsMarkdown(text);
      renderAnimations(rows);
    } catch (err) {
      console.error('Error loading animations data:', err);
      document.getElementById('artGallery').innerHTML =
              '<div class="merch-loading">Error loading animations. Please try again.</div>';
    }
  }

  document.addEventListener('DOMContentLoaded', loadAnimations);
</script>
