<script>
    // ===== MARKDOWN PARSER =====
    function parseVideosMarkdown(md) {
        const videos = [];
        let current = null;

        for (const line of md.split('\n')) {
            const t = line.trim();
            if (t.startsWith('## ')) {
                current = {
                    title: t.replace('## ', ''),
                    youtube_id: '', cover: '', year: '',
                    description: '', stills: []
                };
                videos.push(current);
            } else if (t.startsWith('- ') && current) {
                const m = t.match(/^- ([\w_]+):\s*(.+)$/);
                if (m) {
                    if (m[1] === 'stills') {
                        current.stills = m[2].split(',').map(s => s.trim()).filter(Boolean);
                    } else {
                        current[m[1]] = m[2];
                    }
                }
            }
        }
        return videos;
    }

    // ===== RENDER =====
    function renderVideos(videos) {
        const list = document.getElementById('videosList');
        list.innerHTML = '';

        for (const video of videos) {
            const item = document.createElement('div');
            item.className = 'video-item';
            item.onclick = () => openVideoModal(video.youtube_id, video.title, video.description);

            // Duplicate stills for seamless loop
            const allStills = [...video.stills, ...video.stills];
            const stillsHtml = allStills.map(src =>
                `<div class="still-thumb"><img src="${src}" alt="Still"></div>`
            ).join('');

            item.innerHTML = `
                <div class="video-top">
                    <div class="video-cover">
                        <img src="${video.cover}" alt="${video.title}">
                        <div class="play-overlay">&#9654;</div>
                    </div>
                    <div class="video-right">
                        <div class="video-info">
                            <h3 class="video-title">${video.title}</h3>
                            <div class="video-year">${video.year}</div>
                            <div class="video-description">${video.description}</div>
                        </div>
                        <div class="video-stills">
                            <div class="stills-track">
                                ${stillsHtml}
                            </div>
                        </div>
                    </div>
                </div>
            `;

            list.appendChild(item);
        }

        // Fade-in animation
        const items = list.querySelectorAll('.video-item');
        const observer = new IntersectionObserver((entries) => {
            entries.forEach((entry, index) => {
                if (entry.isIntersecting) {
                    setTimeout(() => {
                        entry.target.style.opacity = '1';
                        entry.target.style.transform = 'translateY(0)';
                    }, index * 150);
                }
            });
        }, { threshold: 0.1, rootMargin: '50px' });

        items.forEach(item => {
            item.style.opacity = '0';
            item.style.transform = 'translateY(30px)';
            item.style.transition = 'opacity 0.6s ease, transform 0.6s ease';
            observer.observe(item);
        });
    }

    // ===== MODAL =====
    function openVideoModal(youtubeId, title, description) {
        const modal = document.getElementById('videoModal');
        document.getElementById('modalYouTube').src =
            `https://www.youtube.com/embed/${youtubeId}?autoplay=1`;
        document.getElementById('modalTitle').textContent = title;
        document.getElementById('modalDescription').textContent = description;
        modal.style.display = 'block';
        document.body.style.overflow = 'hidden';
        setTimeout(() => { modal.style.opacity = '1'; }, 10);
    }

    function closeVideoModal() {
        const modal = document.getElementById('videoModal');
        document.getElementById('modalYouTube').src = '';
        modal.style.opacity = '0';
        setTimeout(() => {
            modal.style.display = 'none';
            document.body.style.overflow = 'auto';
        }, 300);
    }

    window.addEventListener('click', (e) => {
        if (e.target === document.getElementById('videoModal')) closeVideoModal();
    });
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeVideoModal();
    });

    // ===== LOAD =====
    async function loadVideos() {
        try {
            const response = await fetch('../data/videos.md');
            if (!response.ok) throw new Error('Failed to load videos.md');
            const text = await response.text();
            renderVideos(parseVideosMarkdown(text));
        } catch (err) {
            console.error('Error loading videos:', err);
            document.getElementById('videosList').innerHTML =
                '<div class="video-loading">Error loading videos.</div>';
        }
    }

    document.addEventListener('DOMContentLoaded', loadVideos);
</script>
