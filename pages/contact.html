<script>
    // Show/hide appropriate layout based on screen size
    function updateLayout() {
        const desktopLayout = document.querySelector('.preview-image');
        const mobileLayout = document.querySelector('.preview-section');

        if (window.innerWidth <= 768) {
            desktopLayout.style.display = 'none';
            mobileLayout.style.display = 'flex';
        } else {
            desktopLayout.style.display = 'block';
            mobileLayout.style.display = 'none';
        }
    }

    // Initial layout update
    updateLayout();

    // Update layout on window resize
    window.addEventListener('resize', updateLayout);
</script>
